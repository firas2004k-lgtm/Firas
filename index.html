<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS4 EXPLOIT CORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --dark-space: #05060d;
      --panel-bg: rgba(10, 14, 28, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--dark-space);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    /* لوحة جزيئات الطاقة */
    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* خطوط السرعة الأنمي في الخلفية */
    .anime-speedlines {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 95%),
                  repeating-conic-gradient(from 0deg, rgba(0, 243, 255, 0.03) 0deg 2deg, transparent 2deg 12deg);
      animation: rotateLines 20s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes rotateLines {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* الإطار الرئيسي المستقبلي */
    .hud-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 760px;
      padding: 40px 30px;
      background: var(--panel-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
      box-shadow: 0 0 45px rgba(0, 243, 255, 0.35), inset 0 0 25px rgba(255, 0, 85, 0.2);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .badge-top {
      display: inline-block;
      padding: 5px 16px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      border-radius: 4px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* العنوان النظيف */
    .main-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #ffffff 20%, var(--neon-cyan) 70%, var(--neon-magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.6));
      margin-bottom: 25px;
    }

    /* شبكة مؤشرات الحالة */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.5);
      border-left: 3px solid var(--neon-cyan);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 6px;
      transform: skew(-6deg);
    }

    .stat-card span {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .stat-card strong {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 17px;
      color: #fff;
    }

    /* زر التفعيل البسيط والمميز */
    .ignite-button {
      position: relative;
      display: inline-block;
      padding: 18px 75px;
      font-family: 'Tajawal', 'Chakra Petch', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff0055 0%, #7900ff 50%, #00f3ff 100%);
      background-size: 200% 200%;
      border: none;
      clip-path: polygon(20px 0%, 100% 0%, calc(100% - 20px) 100%, 0% 100%);
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6), 0 0 50px rgba(0, 243, 255, 0.3);
      animation: pulseGradient 3s ease infinite;
      transition: all 0.25s ease-in-out;
    }

    @keyframes pulseGradient {
      0% { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255, 0, 85, 0.6); }
      50% { background-position: 100% 50%; box-shadow: 0 0 45px rgba(0, 243, 255, 0.8); }
      100% { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255, 0, 85, 0.6); }
    }

    .ignite-button:hover, .ignite-button:focus {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 0 55px rgba(0, 243, 255, 0.9);
      outline: none;
    }

    /* شريط التقدم */
    .gauge-wrapper {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: 30px;
      border-radius: 6px;
      overflow: hidden;
      display: none;
    }

    .gauge-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      box-shadow: 0 0 15px var(--neon-cyan);
      transition: width 0.35s ease;
    }

    #status-display {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--neon-cyan);
      min-height: 24px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="anime-speedlines"></div>
  <canvas id="fx-canvas"></canvas>

  <div class="hud-container">
    <div class="badge-top">SYSTEM EXPLOIT // 13.52</div>
    <h1 class="main-title">PS4 GOLDHEN</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <span>النظام المستهدف</span>
        <strong>FW 13.52</strong>
      </div>
      <div class="stat-card">
        <span>الحالة</span>
        <strong id="core-status" style="color: var(--neon-cyan);">READY</strong>
      </div>
    </div>

    <!-- زر التفعيل -->
    <button class="ignite-button" id="ignite-btn" onclick="executeCoreExploit()">
      تفعيل
    </button>

    <div class="gauge-wrapper" id="gauge">
      <div class="gauge-fill" id="gauge-fill"></div>
    </div>

    <div id="status-display">اضغط على تفعيل للبدء...</div>
  </div>

  <script>
    // مؤثرات الشرارات والجزيئات المتحركة
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, sparks = [];

    function setDimensions() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', setDimensions);
    setDimensions();

    class EnergySpark {
      constructor() {
        this.init();
      }
      init() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 50;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = -(Math.random() * 3 + 1.5);
        this.size = Math.random() * 2.5 + 1;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.color = Math.random() > 0.4 ? '#00f3ff' : '#ff0055';
      }
      step() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.005;
        if (this.y < 0 || this.alpha <= 0) {
          this.init();
        }
      }
      render() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 75; i++) {
      sparks.push(new EnergySpark());
    }

    function renderLoop() {
      ctx.clearRect(0, 0, width, height);
      for (let s of sparks) {
        s.step();
        s.render();
      }
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // تشغيل كود الثغرة
    function executeCoreExploit() {
      const btn = document.getElementById('ignite-btn');
      const gauge = document.getElementById('gauge');
      const gaugeFill = document.getElementById('gauge-fill');
      const statusDisplay = document.getElementById('status-display');
      const coreStatus = document.getElementById('core-status');

      btn.disabled = true;
      btn.style.filter = "grayscale(70%)";
      gauge.style.display = "block";
      coreStatus.innerText = "RUNNING...";
      coreStatus.style.color = "#ff0055";

      statusDisplay.innerText = "جاري تفعيل الثغرة، يرجى الانتظار...";
      gaugeFill.style.width = "40%";

      setTimeout(() => {
        gaugeFill.style.width = "75%";
        statusDisplay.innerText = "جاري حقن الـ Payload و GoldHEN...";

        setTimeout(() => {
          gaugeFill.style.width = "100%";
          statusDisplay.innerText = "اكتمل التفعيل بنجاح!";
          coreStatus.innerText = "ACTIVE";
          coreStatus.style.color = "#00f3ff";

          // استدعاء دوال الثغرة الموجودة في المستودع
          if (typeof runExploit === "function") {
            runExploit();
          } else if (typeof run === "function") {
            run();
          } else if (typeof main === "function") {
            main();
          }
        }, 1200);
      }, 1000);
    }
  </script>
</body>
</html>
