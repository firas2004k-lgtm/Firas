<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS4 EXPLOIT HOST</title>
  <style>
    :root {
      --primary: #00f3ff;
      --secondary: #bd00ff;
      --bg: #070913;
      --panel: rgba(16, 20, 38, 0.75);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: sans-serif;
    }
    body {
      background-color: var(--bg);
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .dashboard {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      padding: 35px;
      background: var(--panel);
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
    }
    .launch-btn {
      width: 250px;
      height: 65px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      transition: transform 0.2s;
    }
    .launch-btn:hover {
      transform: scale(1.05);
    }
    #status {
      margin-top: 25px;
      font-size: 16px;
      color: #7efcff;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="dashboard">
    <h1>FYRO PS4 HOST</h1>
    <p style="margin-bottom: 25px; color: #8b9bb4;">إصدار التحديث: 13.52</p>
    <button class="launch-btn" id="start-btn" onclick="startJailbreak()">تفعيل الجيلبريك</button>
    <div id="status">جاهز للتشغيل... اضغط على الزر</div>
  </div>

  <script>
    // خلفية الجزيئات المتحركة
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
    let dots = Array.from({length: 50}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1
    }));
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#00f3ff';
      dots.forEach(d => {
        d.x += d.vx; d.y += d.vy;
        if(d.x<0||d.x>w) d.vx*=-1;
        if(d.y<0||d.y>h) d.vy*=-1;
        ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI*2); ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // تشغيل الثغرة عند الضغط
    function startJailbreak() {
      document.getElementById('status').innerText = "جاري تفعيل الثغرة، يرجى الانتظار...";
      // استدعاء ملف الـ Payload التابع لـ raw13g
      if (typeof run === "function") { run(); }
      else if (typeof main === "function") { main(); }
    }
  </script>
</body>
</html>
